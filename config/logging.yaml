version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "[%(asctime)s] [%(levelname)s] [%(name)s] %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

  json:
    format: '{"timestamp": "%(asctime)s", "level": "%(levelname)s", "logger": "%(name)s", "message": "%(message)s"}'
    datefmt: "%Y-%m-%dT%H:%M:%S"

  rich:
    format: "%(message)s"

handlers:
  console:
    class: rich.logging.RichHandler
    level: DEBUG
    formatter: rich
    stream: ext://sys.stdout

  file:
    class: logging.handlers.TimedRotatingFileHandler
    level: DEBUG
    formatter: standard
    filename: logs/hanuman.log
    when: midnight
    backupCount: 7
    encoding: utf8

  error_file:
    class: logging.FileHandler
    level: ERROR
    formatter: json
    filename: logs/hanuman_error.log
    encoding: utf8

  # Préparation pour future intégration webhook (non activé)
  # webhook:
  #   class: logging.handlers.HTTPHandler
  #   level: ERROR
  #   formatter: json
  #   host: "localhost:8000"  # à adapter
  #   url: "/log-alert"
  #   method: "POST"

loggers:
  hanuman:
    level: DEBUG
    handlers: [console, file]
    propagate: no

  hanuman.services.notion:
    level: INFO
    handlers: [file]
    propagate: no

  hanuman.core:
    level: DEBUG
    handlers: [console]
    propagate: no

root:
  level: INFO
  handlers: [console, file, error_file]
