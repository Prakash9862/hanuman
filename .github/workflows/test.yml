name: 🧪 Hanuman CI – Lint + Test + Type + Security

on:
  push:
    branches: [ main, v2.* ]
  pull_request:
    branches: [ main ]

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v3

    - name: ⚙️ Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: 3.12

    - name: 📦 Install Poetry & dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install --with dev

    - name: 🧼 Lint code (ruff)
      run: poetry run ruff check src tests

    - name: 🎨 Format check (black)
      run: poetry run black --check src tests

    - name: 🔠 Type check (mypy)
      run: poetry run mypy src

    - name: Run tests with pytest + coverage
      run: poetry run pytest --cov=src/hanuman --cov-report=term-missing --cov-report=xml
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.de06d89e-022e-4597-aa92-d4d9d0f5b629 }}
        files: coverage.xml
        flags: unittests
        name: codecov-hanuman
        fail_ci_if_error: true

    - name: 🔐 Security audit (Semgrep Scan)
      run: poetry run semgrep -c .semgrep.yml src/
