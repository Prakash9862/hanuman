name: 🧪 Hanuman CI – Lint + Test + Type + Security

on:
  push:
    branches: [main, v3-dev]
  pull_request:
    branches: [main]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: ⚙️ Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: 📦 Install Poetry & dependencies
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --with dev

      - name: 🧼 Lint code (ruff)
        run: poetry run ruff check src tests

      - name: 🎨 Format check (black)
        run: poetry run black --check src tests

      - name: 🔠 Type check (mypy)
        run: poetry run mypy src

      - name: Run tests with pytest + coverage
        run: poetry run pytest --cov=src/hanuman --cov-report=term-missing --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          name: codecov-hanuman
          fail_ci_if_error: true

      - name: 🔐 Security audit (Semgrep Scan)
        run: poetry run semgrep -c .semgrep.yml src/
