name: GitHub Project Memory

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-project-memory-main
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_ALLOWED_REPOSITORIES: ${{ github.repository }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_PROJECT_MEMORY_PARENT_PAGE_ID: ${{ secrets.NOTION_PROJECT_MEMORY_PARENT_PAGE_ID }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install poetry==2.1.4

      - name: Install Hanuman
        run: poetry install --only main --no-interaction

      - name: Synchronize and verify Project Memory
        run: >-
          poetry run hanuman flows github-project-memory apply
          --repository "${{ github.repository }}"
          --branch "${{ github.ref_name }}"
          --max-commits 100
          --session-window-hours 24
          --session-max-duration-hours 12
          --trigger github_actions
