[mypy]
python_version = 3.12
strict = False
ignore_missing_imports = True
warn_unused_ignores = True
warn_return_any = True

# On coupe les bruits courants côté web (routes, décorateurs non typés, dict génériques)
disable_error_code = no-untyped-def,misc,type-arg

[mypy-tests.*]
ignore_errors = True
