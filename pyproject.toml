[project]
name = "hanuman"
version = "0.1.0"
description = ""
authors = [
    {name = "Prakash9862",email = "v.bridet98@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.115.12,<0.116.0)",
    "uvicorn[standard] (>=0.34.3,<0.35.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "rich (>=14.0.0,<15.0.0)"
]

[tool.poetry]
packages = [{include = "hanuman", from = "src"}]


[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
flake8 = "^7.2.0"
mypy = "^1.16.0"
pylint = "^3.3.7"
pytest = "^8.4.0"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py312"]
skip-string-normalization = true

[tool.flake8]
max-line-length = 88
exclude = ["tests/*", "logs/*"]

[tool.mypy]
strict = true
ignore_missing_imports = true
