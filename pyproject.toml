[project]
name = "hanuman"
version = "0.1.0"
description = ""
authors = [
    {name = "Prakash9862",email = "v.bridet98@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.115.12,<0.116.0)",
    "uvicorn[standard] (>=0.34.3,<0.35.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "rich (==13.5.2)",
    "structlog (>=25.4.0,<26.0.0)",
    "pydantic-settings (>=2.9.1,<3.0.0)",
]

[tool.poetry]
packages = [{include = "hanuman", from = "src"}]


[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
mypy = "^1.16.0"
pylint = "^3.3.7"
pytest = "^8.4.0"
httpx = "^0.28.1"
types-pyyaml = "^6.0.12.20250516"
semgrep = "^1.125.0"
pytest-cov = "^6.2.1"
ruff = "^0.11.13"
pytest-asyncio = "^1.0.0"
python-dotenv = "^1.1.0"
types-requests = "^2.32.4.20250913"
pre-commit = "^4.4.0"
textual = "^0.70.0"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py312"]
skip-string-normalization = true

[tool.ruff]
line-length = 88
target-version = "py311"
lint.select = ["E", "F", "I"]         # pycodestyle, pyflakes, isort
lint.ignore = ["E501"]                # lignes trop longues


[tool.mypy]
strict = true
ignore_missing_imports = true
